name: Package fork builds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            pack_script: pack:win-x64
            artifact_name: netcatty-windows-x64
          - name: macos
            os: macos-latest
            pack_script: pack:mac
            artifact_name: netcatty-macos
          - name: linux-x64
            os: ubuntu-22.04
            pack_script: pack:linux-x64
            artifact_name: netcatty-linux-x64

    env:
      GITHUB_TOKEN: ${{ github.token }}
      ELECTRON_BUILDER_PUBLISH: never
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MOSH_BIN_OWNER: binaricat
      ET_BIN_OWNER: binaricat

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDBC sidecar)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Set up MSVC developer command prompt
        if: matrix.name == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux packaging dependencies
        if: matrix.name == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Set package version
        shell: bash
        run: |
          VERSION="0.0.0-fork-${GITHUB_SHA:0:7}"
          echo "Setting version to ${VERSION}"
          npm pkg set version="${VERSION}"

      - name: Prepare node-pty Linux runtime
        if: matrix.name == 'linux-x64'
        run: bash scripts/ensure-node-pty-linux.sh prepare x64

      - name: Fetch bundled mosh-client
        run: npm run fetch:mosh:dev

      - name: Fetch bundled et-client
        run: npm run fetch:et:dev

      - name: Build package
        run: npm run ${{ matrix.pack_script }}

      - name: Verify node-pty Linux runtime
        if: matrix.name == 'linux-x64'
        run: bash scripts/ensure-node-pty-linux.sh verify x64

      - name: Verify Linux deb artifact
        if: matrix.name == 'linux-x64'
        run: bash scripts/verify-linux-deb-artifact.sh amd64

      - name: Collect upload files
        shell: bash
        run: |
          rm -rf release-upload
          mkdir -p release-upload
          case "${{ matrix.name }}" in
            windows-x64)
              find release -maxdepth 1 -type f -name '*-win-x64.exe' ! -name '*portable*' -exec cp -v '{}' release-upload/ ';'
              ;;
            macos)
              find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp -v '{}' release-upload/ ';'
              ;;
            linux-x64)
              find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' \) -exec cp -v '{}' release-upload/ ';'
              ;;
          esac
          find release-upload -maxdepth 1 -type f -print
          test "$(find release-upload -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify macOS bundle signature
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release-upload/*.dmg; do
            echo "== $dmg"
            attach_out="$(hdiutil attach -nobrowse -readonly "$dmg")"
            mount_point="$(printf '%s\n' "$attach_out" | awk -F '\t' '/\/Volumes\// {print $NF}' | tail -1)"
            echo "mount point: $mount_point"
            app="$(find "$mount_point" -maxdepth 1 -name '*.app' -type d | head -1)"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Signature|TeamIdentifier|Identifier|flags' || true
            if codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'; then
              echo "::warning title=Ad-hoc signed build::This dmg is ad-hoc signed only; downloaded copies are blocked by Gatekeeper until unquarantined."
            fi
            hdiutil detach "$mount_point" >/dev/null
          done

      - name: Publish Windows x64 release asset
        if: matrix.name == 'windows-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fork-windows-x64-latest"
          title="Fork Windows x64 latest"
          notes="Latest Windows x64 installer produced by the fork packaging workflow."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "$title" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" release-upload/* --clobber

      - name: Publish macOS release assets
        if: matrix.name == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fork-macos-latest"
          title="Fork macOS latest"
          notes="Latest macOS dmg/zip produced by the fork packaging workflow (ad-hoc signed, not notarized).
          A copy downloaded from GitHub carries the quarantine flag, so the first launch is blocked by Gatekeeper.
          Unquarantine once after installing: xattr -dr com.apple.quarantine /Applications/Netcatty.app"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "$title" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" release-upload/* --clobber
